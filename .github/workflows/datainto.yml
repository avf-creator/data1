name: data1
on:
  schedule:
    - cron: "30 20 * * *"
    - cron: "30 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: q1
  cancel-in-progress: false
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests beautifulsoup4 google-auth google-api-python-client
      - name: z
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID || vars.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_TAB_NAME: ${{ secrets.GOOGLE_SHEET_TAB_NAME || vars.GOOGLE_SHEET_TAB_NAME || 'Sheet1' }}
          MAX_RUNTIME_MINUTES: "300"
        run: python datainto.py
      - name: s
        if: always()
        run: |
          if [ -f internshala_directory_progress.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add internshala_directory_progress.json
            if git diff --cached --quiet; then
              echo "No progress change to save."
            else
              git commit -m "u [skip ci]"
              for i in 1 2 3; do
                git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
                sleep 10
              done
            fi
          fi
